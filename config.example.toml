gitlab_url = "https://gitlab.example.com"

# Slack channel ID (C…), or your own user ID (U…) to get a DM from the bot.
# Ignored when SLACK_WEBHOOK_URL is used (the webhook decides the channel).
slack_channel = ""

# Projects to watch for new MRs (full path or numeric ID).
watched_projects = [
  "my-group/my-subgroup/my-project",
]

notify_todos = true            # mentions, review requests, assignments, failed pipelines...
notify_new_mrs = true          # new MRs on watched_projects
notify_my_mr_activity = true   # comments / approvals / merge on MRs you authored
notify_pipelines = true        # final pipeline status on your open MRs
# Which final statuses to report ("success", "failed", "canceled"). Failures already arrive as a
# "build_failed" to-do when you triggered the pipeline, hence only "success" by default.
pipeline_statuses = ["success"]

include_own_mrs = false
include_drafts = true

# Restrict which to-do types are forwarded (comment out to get all of them):
# todo_actions = ["mentioned", "directly_addressed", "review_requested", "assigned", "build_failed", "approval_required", "unmergeable"]

# --- Filtering ---
# Drop notifications from these authors (GitLab usernames / YouTrack logins), e.g. bots:
ignore_authors = []            # ["renovate-bot", "gitlab-bot"]
# Drop notifications whose MR / issue title matches one of these regexes (case-insensitive):
ignore_title_patterns = []     # ["^chore\\(deps\\)"]
# Mute whole kinds: todo actions (mentioned, review_requested, build_failed...), new_mr, mr_comment,
# mr_approved, mr_unapproved, mr_merged, pipeline_success, pipeline_failed, pipeline_canceled,
# yt_mention, yt_assigned, yt_comment, yt_field, yt_new_issue
muted_kinds = []

# --- YouTrack (enabled when YOUTRACK_TOKEN is set) ---
youtrack_url = "https://youtrack.example.com"
notify_youtrack = true
# Issues that "concern you": comments, new issues and field changes on these are forwarded.
# Mentions (@you in a comment) and assignments to you are always forwarded, on any issue.
youtrack_query = "for: me or reporter: me or commenter: me or tag: Star"
# Field changes to report on those issues:
youtrack_fields = ["State", "Priority", "Activity"]

# --- Morning greeting: once a day, on the first poll at/after morning_hour (local time) ---
morning_greeting = true
morning_hour = 8
morning_weekdays_only = true
stale_review_days = 2          # MRs awaiting your review for >= N days get an :hourglass: in the summary

# --- Delivery ---
# Quiet hours (local time): notifications are held, then delivered when they end (as a digest if many).
# quiet_hours = "19:00-08:30"
quiet_weekends = false
# Kinds delivered even during quiet hours (see muted_kinds for the list):
quiet_bypass = []              # ["review_requested", "directly_addressed"]
# When at least this many messages are pending at once (after grouping by MR / issue), merge them
# into one digest (0 = never).
batch_threshold = 5
# After N consecutive failed polls (VPN down, GitLab unreachable...), post an alert, then a "back
# online" message on recovery (0 = never).
alert_after_failures = 5
